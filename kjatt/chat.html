<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kjatt.fo - Chat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body class="chat-body">
    <header class="chat-header">
        <nav class="container">
            <a href="index.html" class="logo">kjatt.fo</a>
        </nav>
    </header>

    <main class="chat-container">
        <div id="chat-history" class="chat-history">
            <!-- Chat messages will appear here -->
            <div class="empty-state">
                <p>Byrja eina samrøðu við kjatt.fo</p>
            </div>
        </div>

        <div class="chat-input-area">
            <div class="container">
                <div class="input-wrapper">
                    <input type="text" id="chat-input" placeholder="Skriva tíni boð..." autocomplete="off">
                    <button id="send-btn" class="btn-primary send-btn">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <script src="chat.js"></script>
</body>

</html>
